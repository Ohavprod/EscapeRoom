<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פרויקט הכספת: 11 המנעולים | אלו מציאות</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --metal-base: #2c3e50;
            --metal-light: #4ca1af;
            --neon-blue: #00f3ff;
            --neon-red: #ff003c;
            --neon-green: #39ff14;
            --text-main: #e0e0e0;
        }

        body {
            font-family: 'Heebo', sans-serif;
            background: radial-gradient(circle at center, #1a1a24 0%, #000000 100%);
            color: var(--text-main);
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
            user-select: none;
        }

        /* HUD & Timer */
        .hud {
            position: fixed; top: 0; left: 0; width: 100%;
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            display: flex; justify-content: space-between;
            padding: 15px 30px; box-sizing: border-box; z-index: 100;
            font-family: 'Share Tech Mono', monospace; font-size: 1.5rem; color: var(--neon-blue);
        }

        /* The Vault Room */
        .vault-container {
            position: relative; width: 900px; height: 600px;
            perspective: 1000px; margin-top: 50px;
        }

        /* Realistic Vault Door */
        .door-frame {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(135deg, #111, #222);
            border: 10px solid #1a1a1a; border-radius: 20px;
            box-shadow: inset 0 0 50px #000, 0 20px 50px rgba(0,0,0,0.9);
            overflow: hidden; display: flex;
        }

        .door-panel {
            width: 50%; height: 100%;
            background: linear-gradient(90deg, #2b3238, #1e2328);
            border: 2px solid #444; position: relative;
            transition: transform 1.5s cubic-bezier(0.77, 0, 0.175, 1);
            display: flex; justify-content: center; align-items: center;
            z-index: 10;
        }
        
        .door-panel::after {
            content: ''; position: absolute; width: 20px; height: 100%;
            background: linear-gradient(90deg, rgba(0,0,0,0.8), transparent);
        }
        .door-panel.left { border-right: 4px solid #111; transform-origin: left; }
        .door-panel.left::after { right: 0; }
        .door-panel.right { border-left: 4px solid #111; transform-origin: right; }
        .door-panel.right::after { left: 0; background: linear-gradient(-90deg, rgba(0,0,0,0.8), transparent); }

        .door-frame.open .door-panel.left { transform: translateX(-100%); }
        .door-frame.open .door-panel.right { transform: translateX(100%); }

        /* Content inside the door */
        .room-content {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            padding: 40px; box-sizing: border-box; text-align: center;
            background: radial-gradient(circle, #1a252f, #0f1418);
            z-index: 5; opacity: 0; transition: opacity 0.5s 1s;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
        }
        .door-frame.open .room-content { opacity: 1; }

        h1 { color: var(--neon-blue); text-shadow: 0 0 10px rgba(0, 243, 255, 0.5); font-size: 2rem; margin-top: 0; }
        .mission-brief {
            background: rgba(0,0,0,0.6); border-left: 4px solid var(--neon-blue);
            padding: 15px; margin-bottom: 25px; font-size: 1.2rem; text-align: right; width: 100%;
        }

        /* --- Realistic Lock Components --- */
        
        /* 1. Digital Keypad */
        .keypad {
            background: #111; border: 3px solid #333; border-radius: 10px;
            padding: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            box-shadow: inset 0 0 20px #000, 0 10px 20px rgba(0,0,0,0.8); width: 250px;
        }
        .key-btn {
            background: linear-gradient(to bottom, #444, #222); color: white;
            border: 1px solid #111; border-radius: 5px; height: 50px; font-size: 1.5rem;
            font-family: 'Share Tech Mono'; cursor: pointer;
            box-shadow: inset 0 2px 2px rgba(255,255,255,0.2), 0 4px 5px rgba(0,0,0,0.5);
            transition: 0.1s;
        }
        .key-btn:active { transform: translateY(4px); box-shadow: inset 0 2px 5px rgba(0,0,0,0.8); }
        .key-screen {
            grid-column: 1 / 4; background: #0a1914; color: var(--neon-green);
            height: 50px; display: flex; align-items: center; justify-content: center;
            font-size: 2rem; font-family: 'Share Tech Mono'; letter-spacing: 5px;
            border: 2px solid #000; box-shadow: inset 0 0 10px #000; border-radius: 5px; margin-bottom: 10px;
        }

        /* 2. Circuit Breaker (Switches) */
        .circuit-board {
            background: #2a2a2a; border: 4px solid #111; padding: 20px; border-radius: 10px;
            display: flex; justify-content: center; gap: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .switch-container { display: flex; flex-direction: column; align-items: center; width: 80px; }
        .switch-label { font-size: 0.9rem; text-align: center; margin-bottom: 10px; height: 40px; }
        .switch {
            width: 40px; height: 80px; background: #111; border-radius: 5px;
            position: relative; cursor: pointer; border: 2px solid #000; box-shadow: inset 0 0 10px #000;
        }
        .switch-knob {
            width: 36px; height: 36px; background: linear-gradient(to bottom, #d32f2f, #9a0007);
            border-radius: 3px; position: absolute; top: 2px; left: 0; transition: 0.3s;
            box-shadow: 0 4px 5px rgba(0,0,0,0.5), inset 0 2px 2px rgba(255,255,255,0.3);
        }
        .switch.on .switch-knob { top: 38px; background: linear-gradient(to bottom, #388e3c, #005005); }

        /* 3. Wires / Cyber Drag */
        .wires-panel { display: flex; gap: 40px; align-items: center; margin-top: 20px; }
        .wire-port {
            width: 60px; height: 60px; background: #111; border-radius: 50%; border: 3px solid #333;
            display: flex; justify-content: center; align-items: center; font-size: 0.8rem; text-align: center;
        }
        .wire {
            width: 150px; height: 15px; background: repeating-linear-gradient(45deg, #e74c3c, #e74c3c 10px, #c0392b 10px, #c0392b 20px);
            border-radius: 10px; cursor: pointer; box-shadow: 0 5px 10px rgba(0,0,0,0.5); transition: 0.2s;
        }
        .wire:hover { filter: brightness(1.2); }

        /* Master Button */
        .master-btn {
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            color: var(--neon-blue); border: 2px solid var(--neon-blue); padding: 15px 40px;
            font-size: 1.5rem; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 30px;
            text-transform: uppercase; letter-spacing: 2px; transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2), inset 0 0 10px rgba(0, 243, 255, 0.1);
        }
        .master-btn:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 30px var(--neon-blue); }

        /* Status Text */
        .status { margin-top: 15px; font-weight: bold; font-family: 'Share Tech Mono'; font-size: 1.2rem; min-height: 25px; }
        .status.error { color: var(--neon-red); text-shadow: 0 0 10px var(--neon-red); }
        .status.success { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); }

        /* Shake Animation */
        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-15px); } 40%, 80% { transform: translateX(15px); } }

        /* Hidden class for stage management */
        .d-none { display: none !important; }

        /* Lock display on doors */
        .door-lock-circle {
            position: absolute; width: 120px; height: 120px; background: #111;
            border-radius: 50%; border: 5px solid #444; z-index: 20;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 30px #000, inset 0 0 20px #000; transition: opacity 0.5s;
        }
        .door-lock-circle .inner { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--neon-red); box-shadow: 0 0 20px var(--neon-red); transition: 0.5s; }
        .door-frame.open .door-lock-circle { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <div class="hud">
        <div id="mission-text">מערכת נעולה - רמת אבטחה 1/11</div>
        <div id="timer">00:00:00</div>
    </div>

    <div class="vault-container">
        <div class="door-frame" id="main-door">
            <div class="door-panel left"></div>
            <div class="door-panel right"></div>
            
            <div class="door-lock-circle" id="door-indicator">
                <div class="inner" id="door-inner"></div>
            </div>

            <div class="room-content" id="room-content">
                
                <h1 id="stage-title">אתחול מערכת</h1>
                <div class="mission-brief" id="stage-brief">
                    ברוכים הבאים לכספת בית הדין התת-קרקעית.<br>כדי לפתוח את 11 דלתות הפלדה תצטרכו להפגין שליטה מוחלטת ב-11 המשניות של פרק "אלו מציאות".<br><br>לחצו על הכפתור כדי להתחיל את האתגר. השעון יתחיל לרוץ.
                </div>

                <div id="interface-container">
                    <button class="master-btn" onclick="startGame()">התחל פריצה</button>
                </div>

                <div class="status" id="status-msg"></div>

            </div>
        </div>
    </div>

    <script>
        // --- System Data ---
        let currentStage = 0;
        let timerInterval;
        let timeSeconds = 0;

        // Stage configurations (The 11 Mishnayot)
        const stages = [
            null, // 0 is intro
            {
                title: "מנעול 1: זיהוי סימנים (משנה א')",
                brief: "מערכת המיון קרסה. כדי לאשר את פתיחת הדלת, עליכם להקליד את הקוד למקרים הבאים:<br>1. פירות מפוזרים<br>2. ככרות של נחתום<br>3. מעות מפוזרות<br>הקלידו '0' אם המוצא שומר לעצמו (הרי אלו שלו), ו-'1' אם חייב להכריז.",
                type: "keypad",
                answer: "000" // All 3 have no siman
            },
            {
                title: "מנעול 2: תצורת מטבעות (משנה ב')",
                brief: "זיהוי צורת הנחה נחשב כסימן במטבעות. קודן הכספת דורש את המספר המדויק:<br>כמה מטבעות מינימום צריכים להיות מסודרים כ'מגדל' (זה על גב זה) כדי שיתחייב להכריז עליהם?",
                type: "keypad",
                answer: "3"
            },
            {
                title: "מנעול 3: בקרת נטישה (משנה ג')",
                brief: "אדם מצא כלי. לפניכם 3 מתגים המייצגים מיקומים. כוונו את המתג למצב 'מופעל' (למטה/ירוק) רק אם ההלכה פוסקת שאסור לגעת בחפץ כיוון שהונח בכוונה.",
                type: "switches",
                labels: ["גל דינרים קבוע", "אשפה ישנה", "אשפה חדשה מפוזרת"],
                answer: [true, true, false] // First two are "don't touch", last is "take & announce/keep"
            },
            {
                title: "מנעול 4: פרוטוקול מסחר (משנה ד')",
                brief: "כסף נמצא בחנות. יש לנתב את הכסף לבעליו החוקיים. כוונו למעלה (אדום) אם הכסף שייך למוצא, ולמטה (ירוק) אם הכסף שייך לחנווני.",
                type: "switches",
                labels: ["לפני התיבה (דלפק)", "על התיבה", "בתוך התיבה עצמה"],
                answer: [false, true, true] // false = up/red (Finder), true = down/green (Shopkeeper)
            },
            {
                title: "מנעול 5: המילה השמורה (משנה ה')",
                brief: "הקוד לדלת זו הוא המילה הספציפית שהתורה השתמשה בה כדוגמה לכלל: 'כל דבר שיש בו סימנים ויש לו תובעים חייב להכריז'.<br>הקלידו את המילה (רמז: 4 אותיות, ש-מ-ל-ה).",
                type: "hebrew-keypad",
                answer: "שמלה"
            },
            {
                title: "מנעול 6: תזמון קריאה (משנה ו')",
                brief: "מערכת הכריזה דורשת הגדרת זמן. כמה 'רגלים' (חגים) היה חייב אדם להכריז בירושלים בתקופת המקדש כדי להודיע על אבדה?",
                type: "keypad",
                answer: "3"
            },
            {
                title: "מנעול 7: ניהול משאבים (משנה ז')",
                brief: "יש לכם בהמה שאבדה ו'אינה עושה ואוכלת' (רק מוציאה כסף ולא מכניסה). מתי לדעת תנא קמא יש למכור אותה?<br>1. מיד<br>2. לאחר זמן קצר (3-30 יום)<br>3. אף פעם<br>הקלידו את מספר התשובה הנכונה.",
                type: "keypad",
                answer: "2"
            },
            {
                title: "מנעול 8: פרוטוקול שימוש (משנה ח')",
                brief: "הפעילו (מתג ירוק) רק את הפעולות ש**מותר** למוצא לעשות עם האבדה שנמצאת אצלו.",
                type: "switches",
                labels: ["ללבוש בגד באופן קבוע", "לאוורר בגד לצורכו", "לקרוא בספר לצרכי לימוד", "לגלול ספר כדי שלא יירקב"],
                answer: [false, true, false, true] 
            },
            {
                title: "מנעול 9: רדאר אבדות (משנה ט')",
                brief: "פרה רצה בין הכרמים. הדין הוא 'השב תשיבם' אפילו כמה פעמים. הקלידו את המספר המקסימלי של הפעמים שהמשנה מציינת שחובה להחזיר.",
                type: "keypad",
                answer: "5" // "אפילו ארבעה וחמישה פעמים"
            },
            {
                title: "מנעול 10: קונפליקט פיקוד (משנה י')",
                brief: "יוסי הכהן מצא אבדה בבית קברות. אביו פוקד עליו: 'היטמא והבא אותה!'.<br>1. שמע לאביו (כיבוד הורים).<br>2. אל תשמע לו (שניהם חייבים במצוות ה').<br>הקלידו את מספר ההחלטה.",
                type: "keypad",
                answer: "2"
            },
            {
                title: "מנעול 11: קודש הקודשים (משנה י\"א)",
                brief: "הגעתם לכספת האחרונה! יש לכם אבדה של אביכם ואבדה של רבכם. אתם יכולים להציל רק אחת. קוד הדלת הוא מספר המייצג את מי שיש להציל קודם:<br>1 = אבא<br>2 = הרב המובהק<br>3 = מי שיש לו אבדה יקרה יותר.",
                type: "keypad",
                answer: "2"
            }
        ];

        // --- Core Engine ---

        function updateTimer() {
            timeSeconds++;
            let h = Math.floor(timeSeconds / 3600).toString().padStart(2, '0');
            let m = Math.floor((timeSeconds % 3600) / 60).toString().padStart(2, '0');
            let s = (timeSeconds % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${h}:${m}:${s}`;
        }

        function startGame() {
            timerInterval = setInterval(updateTimer, 1000);
            loadStage(1);
        }

        function loadStage(n) {
            currentStage = n;
            document.getElementById('mission-text').innerText = `מערכת נעולה - רמת אבטחה ${n}/11`;
            
            // Animation: Close door, change content, open door
            const door = document.getElementById('main-door');
            door.classList.remove('open');
            document.getElementById('door-inner').style.borderColor = "var(--neon-red)";
            document.getElementById('door-inner').style.boxShadow = "0 0 20px var(--neon-red)";
            
            setTimeout(() => {
                buildInterface(stages[n]);
                door.classList.add('open');
            }, 1500); // wait for door to close
        }

        let currentInput = ""; // for keypads

        function buildInterface(stageData) {
            document.getElementById('stage-title').innerText = stageData.title;
            document.getElementById('stage-brief').innerHTML = stageData.brief;
            document.getElementById('status-msg').innerText = "";
            document.getElementById('status-msg').className = "status";
            
            const container = document.getElementById('interface-container');
            container.innerHTML = "";
            currentInput = "";

            if (stageData.type === "keypad" || stageData.type === "hebrew-keypad") {
                // Build a high-tech keypad
                let html = `<div class="keypad">
                    <div class="key-screen" id="k-screen">_</div>`;
                
                if (stageData.type === "keypad") {
                    for(let i=1; i<=9; i++) {
                        html += `<button class="key-btn" onclick="pressKey('${i}')">${i}</button>`;
                    }
                    html += `<button class="key-btn" onclick="pressKey('C')" style="color:#ff003c;">CLR</button>
                             <button class="key-btn" onclick="pressKey('0')">0</button>
                             <button class="key-btn" onclick="submitKeypad()" style="color:#39ff14;">ENT</button>`;
                } else {
                    // Hebrew minimal keypad for specific words
                    const chars = ['ש','מ','ל','ה','א','ב','ת','ר','נ'];
                    chars.forEach(c => { html += `<button class="key-btn" onclick="pressKey('${c}')">${c}</button>`; });
                    html += `<button class="key-btn" onclick="pressKey('C')" style="color:#ff003c;">CLR</button>
                             <button class="key-btn" onclick="submitKeypad()" style="color:#39ff14; grid-column: span 2;">ENTER</button>`;
                }
                
                html += `</div>`;
                container.innerHTML = html;
            } 
            else if (stageData.type === "switches") {
                // Build circuit board
                let html = `<div class="circuit-board">`;
                stageData.labels.forEach((label, idx) => {
                    html += `
                    <div class="switch-container">
                        <div class="switch-label">${label}</div>
                        <div class="switch" id="sw-${idx}" onclick="this.classList.toggle('on')">
                            <div class="switch-knob"></div>
                        </div>
                    </div>`;
                });
                html += `</div><button class="master-btn" onclick="submitSwitches()">בצע סנכרון</button>`;
                container.innerHTML = html;
            }
        }

        // --- Interaction Logic ---

        function pressKey(char) {
            const screen = document.getElementById('k-screen');
            if (char === 'C') { currentInput = ""; }
            else { currentInput += char; }
            screen.innerText = currentInput === "" ? "_" : currentInput;
        }

        function triggerError(msg) {
            const status = document.getElementById('status-msg');
            status.innerText = msg;
            status.className = "status error";
            const panel = document.getElementById('interface-container');
            panel.classList.add('shake');
            setTimeout(() => panel.classList.remove('shake'), 400);
            
            // Visual feedback on door lock
            document.getElementById('door-inner').style.borderColor = "var(--neon-red)";
            
            currentInput = ""; 
            const screen = document.getElementById('k-screen');
            if(screen) screen.innerText = "_";
        }

        function triggerSuccess() {
            const status = document.getElementById('status-msg');
            status.innerText = "אימות הושלם בהצלחה. פותח מנעול...";
            status.className = "status success";
            document.getElementById('door-inner').style.borderColor = "var(--neon-green)";
            document.getElementById('door-inner').style.boxShadow = "0 0 20px var(--neon-green)";
            
            setTimeout(() => {
                if (currentStage < 11) {
                    loadStage(currentStage + 1);
                } else {
                    victory();
                }
            }, 1000);
        }

        function submitKeypad() {
            if (currentInput === stages[currentStage].answer) {
                triggerSuccess();
            } else {
                triggerError("קוד שגוי. הגישה נדחתה.");
            }
        }

        function submitSwitches() {
            const ans = stages[currentStage].answer;
            let correct = true;
            ans.forEach((val, idx) => {
                const isOn = document.getElementById(`sw-${idx}`).classList.contains('on');
                if (isOn !== val) correct = false;
            });

            if (correct) {
                triggerSuccess();
            } else {
                triggerError("קצר חשמלי. שגיאה בפרוטוקול ההלכה.");
            }
        }

        // --- Victory ---
        function victory() {
            clearInterval(timerInterval);
            const door = document.getElementById('main-door');
            door.classList.remove('open');
            
            setTimeout(() => {
                const code = "VAULT-" + Math.floor(Math.random() * 9000 + 1000);
                document.getElementById('stage-title').innerText = "קודש הקודשים נפרץ!";
                document.getElementById('stage-brief').innerHTML = `
                    <div style="text-align:center; color:var(--neon-green); font-size:1.5rem; text-shadow:0 0 10px var(--neon-green);">
                        משימה הושלמה בהצלחה!<br>הפגנתם ידע מושלם בכל 11 המשניות.
                    </div>
                    <br>
                    <div style="background:#111; padding:15px; border:2px solid var(--neon-blue); border-radius:5px; text-align:center;">
                        זמן ביצוע: <span style="color:white;">${document.getElementById('timer').innerText}</span><br>
                        קוד אימות מיוחד: <span style="color:var(--neon-blue); font-family:'Share Tech Mono'; font-size:1.5rem;">${code}</span>
                    </div>
                    <br>צלמו מסך זה והעבירו למורה כדי לקבל את הפרס המובטח!
                `;
                document.getElementById('interface-container').innerHTML = "";
                document.getElementById('status-msg').innerText = "";
                door.classList.add('open');
            }, 1500);
        }

    </script>
</body>
</html>
