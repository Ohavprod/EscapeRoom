<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חדר בריחה: פסח - שלב 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="room" id="room">
        <div class="flashlight-overlay" id="flashlight"></div>
        
        <div class="clickable-item scroll" id="hidden-scroll" onclick="openModal()">📜 רמז נסתר</div>
        
        <div class="door-lock" id="door">
            🚪 מנעול הדלת
            <input type="number" id="door-code" placeholder="הכנס קוד פתיחה...">
            <button onclick="checkCode()">פתח</button>
        </div>
    </div>

    <div id="riddle-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>חידת בדיקת חמץ</h2>
            <p>לפי פניני הלכה (פרק ד'): "בתחילת ליל י"ד בניסן בודקים את החמץ..."</p>
            <p><strong>חידה:</strong> אני מאיר את החושך אך איני פנס, דרכי מחפשים בחורים ובסדקים את מה שאסור שייכנס. מי אני?</p>
            <p style="font-size: 0.9em; color: #555;">(קוד הדלת הוא הגימטריה של התשובה)</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
