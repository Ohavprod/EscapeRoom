<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פרויקט הכספת: 11 המנעולים | אלו מציאות</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-red: #ff003c;
            --neon-green: #39ff14;
            --text-main: #e0e0e0;
        }

        body {
            font-family: 'Heebo', sans-serif;
            background: #050505;
            color: var(--text-main);
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
            user-select: none;
        }

        /* HUD & Timer */
        .hud {
            position: fixed; top: 0; left: 0; width: 100%;
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            display: flex; justify-content: space-between;
            padding: 10px 20px; box-sizing: border-box; z-index: 100;
            font-family: 'Share Tech Mono', monospace; font-size: 1.2rem; color: var(--neon-blue);
        }

        /* The Vault Room - Responsive */
        .vault-container {
            position: relative; 
            width: 95vw; max-width: 800px; 
            height: 80vh; max-height: 600px;
            margin-top: 40px;
        }

        /* Realistic Vault Door Frame */
        .door-frame {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f1418; /* The room background */
            border: 8px solid #1a1a1a; border-radius: 15px;
            box-shadow: inset 0 0 50px #000, 0 10px 30px rgba(0,0,0,0.8);
            overflow: hidden; 
        }

        /* The Content inside the Vault (z-index: 1 so it's under the doors) */
        .room-content {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            padding: 20px 15px; box-sizing: border-box; text-align: center;
            background: radial-gradient(circle, #1a252f, #05080a);
            z-index: 1; overflow-y: auto;
            display: flex; flex-direction: column; align-items: center;
        }

        /* The sliding metal doors (z-index: 10 so they cover the content) */
        .door-panel {
            position: absolute; top: 0; width: 50%; height: 100%;
            background: linear-gradient(90deg, #2b3238, #1e2328);
            border: 2px solid #444; z-index: 10;
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
            display: flex; justify-content: center; align-items: center;
        }
        
        .door-panel.left { left: 0; border-right: 4px solid #111; transform-origin: left; }
        .door-panel.right { right: 0; border-left: 4px solid #111; transform-origin: right; }

        /* When .open is added, slide doors out of view */
        .door-frame.open .door-panel.left { transform: translateX(-100%); }
        .door-frame.open .door-panel.right { transform: translateX(100%); }

        /* Typography */
        h1 { color: var(--neon-blue); text-shadow: 0 0 10px rgba(0, 243, 255, 0.4); font-size: 1.8rem; margin: 0 0 10px 0; }
        .mission-brief {
            background: rgba(0,0,0,0.7); border-right: 4px solid var(--neon-blue);
            padding: 10px 15px; margin-bottom: 20px; font-size: 1.1rem; text-align: right; width: 100%; max-width: 600px;
            border-radius: 5px;
        }

        /* --- Lock Components --- */
        
        /* Keypad */
        .keypad {
            background: #111; border: 3px solid #333; border-radius: 10px;
            padding: 15px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
            box-shadow: inset 0 0 20px #000, 0 5px 15px rgba(0,0,0,0.8); width: 100%; max-width: 280px;
            direction: ltr; /* numbers look better LTR */
        }
        .key-btn {
            background: linear-gradient(to bottom, #444, #222); color: white;
            border: 1px solid #111; border-radius: 5px; height: 50px; font-size: 1.5rem;
            font-family: 'Share Tech Mono', sans-serif; cursor: pointer;
            box-shadow: inset 0 2px 2px rgba(255,255,255,0.2), 0 4px 5px rgba(0,0,0,0.5);
        }
        .key-btn:active { transform: translateY(3px); box-shadow: inset 0 1px 2px rgba(0,0,0,0.8); }
        .key-screen {
            grid-column: 1 / 4; background: #0a1914; color: var(--neon-green);
            height: 50px; display: flex; align-items: center; justify-content: center;
            font-size: 2rem; font-family: 'Share Tech Mono', monospace; letter-spacing: 5px;
            border: 2px solid #000; box-shadow: inset 0 0 10px #000; border-radius: 5px; margin-bottom: 10px;
        }

        /* Switches / Circuit Board */
        .circuit-board {
            background: #2a2a2a; border: 3px solid #111; padding: 15px; border-radius: 10px;
            display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.8);
            max-width: 100%;
        }
        .switch-container { display: flex; flex-direction: column; align-items: center; width: 90px; }
        .switch-label { font-size: 0.95rem; text-align: center; margin-bottom: 10px; height: 45px; line-height: 1.1; display: flex; align-items: center; }
        .switch {
            width: 40px; height: 80px; background: #111; border-radius: 5px;
            position: relative; cursor: pointer; border: 2px solid #000; box-shadow: inset 0 0 10px #000;
        }
        .switch-knob {
            width: 36px; height: 36px; background: linear-gradient(to bottom, #d32f2f, #9a0007);
            border-radius: 3px; position: absolute; top: 2px; left: 0; transition: 0.2s;
            box-shadow: 0 4px 5px rgba(0,0,0,0.5), inset 0 2px 2px rgba(255,255,255,0.3);
        }
        .switch.on .switch-knob { top: 38px; background: linear-gradient(to bottom, #388e3c, #005005); }

        .master-btn {
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            color: var(--neon-blue); border: 2px solid var(--neon-blue); padding: 12px 30px;
            font-size: 1.3rem; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 20px;
            text-transform: uppercase; transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }
        .master-btn:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 25px var(--neon-blue); }

        .status { margin-top: 15px; font-weight: bold; font-family: 'Share Tech Mono', monospace; font-size: 1.1rem; min-height: 25px; }
        .status.error { color: var(--neon-red); text-shadow: 0 0 8px var(--neon-red); }
        .status.success { color: var(--neon-green); text-shadow: 0 0 8px var(--neon-green); }

        /* Animation Error Shake */
        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }

        /* The Big Power Button on closed doors */
        .door-lock-circle {
            position: absolute; width: 120px; height: 120px; background: #111;
            border-radius: 50%; border: 4px solid #444; z-index: 20;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 30px #000, inset 0 0 20px #000; transition: opacity 0.3s; cursor: pointer;
        }
        .door-lock-circle:hover .inner { box-shadow: 0 0 30px var(--neon-red); transform: scale(1.05); }
        .door-lock-circle .inner { 
            width: 90px; height: 90px; border-radius: 50%; border: 2px solid var(--neon-red); 
            box-shadow: 0 0 20px var(--neon-red); transition: 0.3s;
            display: flex; justify-content: center; align-items: center;
            color: var(--neon-red); font-weight: bold; font-size: 1.8rem; text-shadow: 0 0 10px var(--neon-red);
        }
        .door-frame.open .door-lock-circle { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <div class="hud">
        <div id="mission-text">מערכת מוכנה להפעלה</div>
        <div id="timer">00:00:00</div>
    </div>

    <div class="vault-container">
        <div class="door-frame" id="main-door">
            
            <div class="room-content" id="room-content">
                <h1 id="stage-title">...</h1>
                <div class="mission-brief" id="stage-brief">...</div>
                <div id="interface-container"></div>
                <div class="status" id="status-msg"></div>
            </div>

            <div class="door-panel left"></div>
            <div class="door-panel right"></div>
            
            <div class="door-lock-circle" id="door-indicator" onclick="bootSystem()">
                <div class="inner" id="door-inner">הפעל</div>
            </div>

        </div>
    </div>

    <script>
        let currentStage = 0;
        let timerInterval;
        let timeSeconds = 0;

        // Stage Configurations (The 11 Mishnayot)
        const stages = [
            null, // 0 
            {
                title: "מנעול 1: זיהוי סימנים (משנה א')",
                brief: "מערכת המיון קרסה. הקלד את הקוד ל-3 מקרים:<br>1. פירות מפוזרים<br>2. ככרות של נחתום<br>3. מעות מפוזרות<br>הקש '0' אם המוצא שומר לעצמו (אין סימן), או '1' אם חייב להכריז.",
                type: "keypad",
                answer: "000"
            },
            {
                title: "מנעול 2: תצורת מטבעות (משנה ב')",
                brief: "זיהוי צורת הנחה. כמה מטבעות מינימום צריכים להיות מסודרים כ'מגדל' (זה על גב זה) כדי שייחשב כסימן ויתחייב להכריז עליהם?",
                type: "keypad",
                answer: "3"
            },
            {
                title: "מנעול 3: בקרת נטישה (משנה ג')",
                brief: "אדם מצא כלי. כוון את המתג למטה (ירוק) <b>רק</b> אם ההלכה פוסקת ש<b>אסור לגעת בו</b> כיוון שהונח בכוונה במקום המשתמר.",
                type: "switches",
                labels: ["גל אבנים קבוע", "אשפה ישנה שאינה מפונה", "אשפה חדשה שמפנים מיד"],
                answer: [true, true, false] 
            },
            {
                title: "מנעול 4: פרוטוקול מסחר (משנה ד')",
                brief: "כסף נמצא בחנות. יש לנתב את הכסף. כוון למעלה (אדום) אם הכסף של המוצא, ולמטה (ירוק) אם הכסף של בעל החנות (החנווני).",
                type: "switches",
                labels: ["לפני התיבה (דלפק)", "על התיבה", "בתוך התיבה"],
                answer: [false, true, true] 
            },
            {
                title: "מנעול 5: מילת הגישה (משנה ה')",
                brief: "הקוד לדלת זו הוא החפץ שהתורה השתמשה בו כדוגמה לכלל: 'כל דבר שיש בו סימנים ויש לו תובעים חייב להכריז'. הקלד את המילה.",
                type: "hebrew-keypad",
                answer: "שמלה"
            },
            {
                title: "מנעול 6: תזמון קריאה (משנה ו')",
                brief: "מערכת הכריזה דורשת הגדרת זמן. כמה 'רגלים' (חגים) היה חייב אדם להכריז בירושלים כדי להודיע על אבדה?",
                type: "keypad",
                answer: "3"
            },
            {
                title: "מנעול 7: ניהול משאבים (משנה ז')",
                brief: "בהמה שאבדה ו'אינה עושה ואוכלת' (רק עולה כסף). מתי יש למכור אותה כדי לשמור את הכסף לבעלים?<br>1. מיד<br>2. לאחר זמן קצר<br>3. אף פעם<br>הקלד את מספר התשובה.",
                type: "keypad",
                answer: "2"
            },
            {
                title: "מנעול 8: פרוטוקול שימוש (משנה ח')",
                brief: "הפעל מתג (למטה/ירוק) רק על פעולות ש<b>מותר</b> למוצא לעשות עם האבדה שנמצאת אצלו.",
                type: "switches",
                labels: ["ללבוש בגד ברחוב באופן קבוע", "לאוורר בגד כדי שלא יירקב", "לקרוא בספר ללמידה עצמית", "לגלול ספר כדי לשמור עליו"],
                answer: [false, true, false, true] 
            },
            {
                title: "מנעול 9: רדאר השבת אבדות (משנה ט')",
                brief: "פרה רצה בין הכרמים. 'השב תשיבם'. הקלד את המספר המקסימלי של הפעמים שהמשנה מציינת שחובה להחזיר.",
                type: "keypad",
                answer: "5"
            },
            {
                title: "מנעול 10: קונפליקט פקודות (משנה י')",
                brief: "יוסי הכהן מצא אבדה בבית קברות. אביו אומר: 'היטמא והבא אותה!'.<br>1. ישמע לאביו (כיבוד הורים).<br>2. לא ישמע לו (כי אסור לכהן להיטמא).",
                type: "keypad",
                answer: "2"
            },
            {
                title: "מנעול 11: קודש הקודשים (משנה י\"א)",
                brief: "כספת אחרונה! יש אבדה של אביכם ואבדה של רבכם (המלמד תורה). ניתן להציל רק אחת. את מי קודם למי יש להשיב?<br>1 = אבא<br>2 = הרב המובהק",
                type: "keypad",
                answer: "2"
            }
        ];

        function updateTimer() {
            timeSeconds++;
            let h = Math.floor(timeSeconds / 3600).toString().padStart(2, '0');
            let m = Math.floor((timeSeconds % 3600) / 60).toString().padStart(2, '0');
            let s = (timeSeconds % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${h}:${m}:${s}`;
        }

        // When the user clicks the big Red "Power" button initially
        function bootSystem() {
            // Hide the power button forever
            document.getElementById('door-indicator').style.display = 'none';
            
            // Start the clock
            timerInterval = setInterval(updateTimer, 1000);
            
            // Setup stage 1 directly and open doors
            currentStage = 1;
            document.getElementById('mission-text').innerText = `מערכת נעולה - רמת אבטחה ${currentStage}/11`;
            buildInterface(stages[currentStage]);
            document.getElementById('main-door').classList.add('open');
        }

        let currentInput = ""; 

        function buildInterface(stageData) {
            document.getElementById('stage-title').innerText = stageData.title;
            document.getElementById('stage-brief').innerHTML = stageData.brief;
            document.getElementById('status-msg').innerText = "";
            document.getElementById('status-msg').className = "status";
            
            const container = document.getElementById('interface-container');
            container.innerHTML = "";
            currentInput = "";

            if (stageData.type === "keypad" || stageData.type === "hebrew-keypad") {
                let html = `<div class="keypad"><div class="key-screen" id="k-screen">_</div>`;
                
                if (stageData.type === "keypad") {
                    for(let i=1; i<=9; i++) {
                        html += `<button class="key-btn" onclick="pressKey('${i}')">${i}</button>`;
                    }
                    html += `<button class="key-btn" onclick="pressKey('C')" style="color:#ff003c;">CLR</button>
                             <button class="key-btn" onclick="pressKey('0')">0</button>
                             <button class="key-btn" onclick="submitKeypad()" style="color:#39ff14;">ENT</button>`;
                } else {
                    const chars = ['ש','מ','ל','ה','א','ב','ת','ר','נ'];
                    chars.forEach(c => { html += `<button class="key-btn" onclick="pressKey('${c}')">${c}</button>`; });
                    html += `<button class="key-btn" onclick="pressKey('C')" style="color:#ff003c;">CLR</button>
                             <button class="key-btn" onclick="submitKeypad()" style="color:#39ff14; grid-column: span 2;">ENTER</button>`;
                }
                html += `</div>`;
                container.innerHTML = html;
            } 
            else if (stageData.type === "switches") {
                let html = `<div class="circuit-board">`;
                stageData.labels.forEach((label, idx) => {
                    html += `
                    <div class="switch-container">
                        <div class="switch-label">${label}</div>
                        <div class="switch" id="sw-${idx}" onclick="this.classList.toggle('on')">
                            <div class="switch-knob"></div>
                        </div>
                    </div>`;
                });
                html += `</div><button class="master-btn" onclick="submitSwitches()">בצע סנכרון ופתח</button>`;
                container.innerHTML = html;
            }
        }

        function pressKey(char) {
            const screen = document.getElementById('k-screen');
            if (char === 'C') { currentInput = ""; }
            else { currentInput += char; }
            screen.innerText = currentInput === "" ? "_" : currentInput;
        }

        function triggerError(msg) {
            const status = document.getElementById('status-msg');
            status.innerText = msg;
            status.className = "status error";
            const panel = document.getElementById('interface-container');
            panel.classList.remove('shake');
            void panel.offsetWidth; // reset animation
            panel.classList.add('shake');
            
            currentInput = ""; 
            const screen = document.getElementById('k-screen');
            if(screen) screen.innerText = "_";
        }

        function triggerSuccess() {
            const status = document.getElementById('status-msg');
            status.innerText = "אימות הצליח! מעדכן מנעול...";
            status.className = "status success";
            
            // 1. Close doors after a short delay
            setTimeout(() => {
                document.getElementById('main-door').classList.remove('open');
                
                // 2. Wait for doors to fully close (1.2s), then setup next stage and reopen
                setTimeout(() => {
                    currentStage++;
                    if (currentStage <= 11) {
                        document.getElementById('mission-text').innerText = `מערכת נעולה - רמת אבטחה ${currentStage}/11`;
                        buildInterface(stages[currentStage]);
                        document.getElementById('main-door').classList.add('open');
                    } else {
                        victory();
                        document.getElementById('main-door').classList.add('open');
                    }
                }, 1300);
            }, 800);
        }

        function submitKeypad() {
            if (currentInput === stages[currentStage].answer) {
                triggerSuccess();
            } else {
                triggerError("קוד שגוי. הגישה נדחתה.");
            }
        }

        function submitSwitches() {
            const ans = stages[currentStage].answer;
            let correct = true;
            ans.forEach((val, idx) => {
                const isOn = document.getElementById(`sw-${idx}`).classList.contains('on');
                if (isOn !== val) correct = false;
            });

            if (correct) {
                triggerSuccess();
            } else {
                triggerError("קצר חשמלי. שגיאה בפרוטוקול ההלכה.");
            }
        }

        function victory() {
            clearInterval(timerInterval);
            const code = "VAULT-" + Math.floor(Math.random() * 9000 + 1000);
            document.getElementById('stage-title').innerText = "קודש הקודשים נפרץ!";
            document.getElementById('stage-brief').innerHTML = `
                <div style="text-align:center; color:var(--neon-green); font-size:1.4rem; text-shadow:0 0 10px var(--neon-green);">
                    משימה הושלמה בהצלחה!<br>הפגנתם ידע מושלם בכל 11 המשניות של אלו מציאות.
                </div>
                <br>
                <div style="background:#111; padding:15px; border:2px solid var(--neon-blue); border-radius:5px; text-align:center;">
                    זמן ביצוע: <span style="color:white;">${document.getElementById('timer').innerText}</span><br>
                    קוד אימות מיוחד: <span style="color:var(--neon-blue); font-family:'Share Tech Mono', sans-serif; font-size:1.5rem;">${code}</span>
                </div>
                <br><div style="text-align:center;">📸 צלמו מסך זה והעבירו למורה כדי לקבל את הפרס!</div>
            `;
            document.getElementById('interface-container').innerHTML = "";
            document.getElementById('status-msg').innerText = "";
        }
    </script>
</body>
</html>
